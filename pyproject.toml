[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "polar-pandas"
version = "0.1.0"
description = "PolarPandas — a DSL translator for data processing pipelines"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]